<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Sohbet Girişi</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 320px;
            text-align: center;
        }
        h2 {
            color: #818cf8;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #334155;
            border: 1px solid #475569;
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
        }
        input::placeholder {
            color: #94a3b8;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
        .btn-login {
            background-color: #6366f1;
        }
        .btn-login:hover {
            background-color: #4f46e5;
        }
        .btn-register {
            background-color: #475569;
        }
        .btn-register:hover {
            background-color: #334155;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Canlı Sohbet Girişi</h2>
        <input type="text" id="username" placeholder="Kullanıcı Adı">
        <input type="text" id="name" placeholder="İsim">
        <input type="password" id="password" placeholder="Şifre">
        
        <div class="btn-group">
            <button class="btn-login" onclick="login()">Giriş Yap</button>
            <button class="btn-register" onclick="register()">Kayıt Ol</button>
        </div>
    </div>

    <!-- JavaScript Dosyası Bağlantısı -->
    <script src="/app.js"></script>
</body>
</html>
